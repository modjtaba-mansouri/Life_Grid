name: life_grid
description: Daily life-tracking app with rated categories, notifications, and stats.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  http: ^1.2.2
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/hal_red.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/hal_red.png"
    background_color: "#000000"
    theme_color: "#000000"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/hal_red.png
    - assets/icon/hal_green.png
