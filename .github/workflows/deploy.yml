name: Build and Deploy Life Grid

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life_grid
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=web,android .
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build web --base-href /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: life_grid/build/web

  deploy-web:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life_grid
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=web,android .
      - name: Enable core library desugaring for flutter_local_notifications
        run: |
          python3 - <<'EOF'
          import pathlib
          kt = pathlib.Path('android/app/build.gradle.kts')
          groovy = pathlib.Path('android/app/build.gradle')
          path = kt if kt.exists() else groovy
          text = path.read_text()
          if 'coreLibraryDesugaring' not in text:
              if kt.exists():
                  text = text.replace(
                      'compileOptions {',
                      'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                      1,
                  )
                  if 'dependencies {' in text:
                      text = text.replace(
                          'dependencies {',
                          'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                          1,
                      )
                  else:
                      text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              else:
                  text = text.replace(
                      'compileOptions {',
                      'compileOptions {\n        coreLibraryDesugaringEnabled true',
                      1,
                  )
                  if 'dependencies {' in text:
                      text = text.replace(
                          'dependencies {',
                          'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"',
                          1,
                      )
                  else:
                      text += '\n\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
          path.write_text(text)
          print('patched', path)
          EOF
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: life-grid-android
          path: life_grid/build/app/outputs/flutter-apk/app-release.apk
